name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: packages/cli
      - run: npm ci
        working-directory: packages/create-substrate
      - run: npx playwright install --with-deps chromium
      # Registry check, package builds, then every scaffold case end to end
      - run: npm run release:check
